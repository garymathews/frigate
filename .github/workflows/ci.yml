name: Build frigate (ROCm)

on:
  workflow_dispatch:
    inputs:
      refresh-dependencies:
        description: Refresh base images and runtime dependencies
        type: boolean
        default: false
  push:
    branches:
      - dev
      - master
      - rocm-*
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/DISCUSSION_TEMPLATE/**"

permissions:
  contents: read
  packages: write

# Superseded hosted builds can stop without canceling self-hosted requests.
concurrency:
  group: rocm-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rocm_build:
    name: AMD64 ROCm Build
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    concurrency:
      group: rocm-10.1-${{ github.workflow }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and push
        uses: ./.github/actions/rocm-build
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          publish-branch: ${{ vars.ROCM_PUBLISH_BRANCH || 'rocm-10.1' }}
          maximize-build-space: 'true'
          refresh-dependencies: ${{ inputs.refresh-dependencies || false }}
