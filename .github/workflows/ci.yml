name: Build Frigate (ROCm 10.1)

on:
  push:
    branches: [rocm-10.1]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/DISCUSSION_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      runner:
        description: Build runner
        type: choice
        options: [github-hosted, self-hosted]
        default: github-hosted

permissions:
  contents: read
  packages: write

# Hosted builds keep the latest request; running self-hosted builds finish.
concurrency:
  group: >-
    rocm-10.1-${{ inputs.runner || 'github-hosted' }}-${{
      inputs.runner == 'self-hosted' && 'build' || github.ref
    }}
  cancel-in-progress: ${{ inputs.runner != 'self-hosted' }}

jobs:
  rocm_build:
    name: AMD64 ROCm Build
    runs-on: >-
      ${{ inputs.runner == 'self-hosted'
        && fromJSON('["self-hosted", "linux", "x64"]')
        || 'ubuntu-22.04' }}
    timeout-minutes: ${{ inputs.runner == 'self-hosted' && 720 || 360 }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare build
        run: |
          docker_config="$RUNNER_TEMP/frigate-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$docker_config"
          chmod 700 "$docker_config"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          short_sha="${GITHUB_SHA:0:8}"
          echo "SHORT_SHA=$short_sha" >> "$GITHUB_ENV"
          version=$(sed -n 's/^VERSION = //p' Makefile)
          printf 'VERSION = "%s-%s"\n' "$version" "$short_sha" > frigate/version.py
          printf 'VITE_GIT_COMMIT_HASH=%s\n' "$short_sha" > web/.env

      - name: Stop Docker
        id: stop-docker
        if: runner.environment == 'github-hosted'
        run: |
          sudo systemctl stop docker
          echo 'stopped=true' >> "$GITHUB_OUTPUT"

      - name: Maximize build space
        if: runner.environment == 'github-hosted'
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c # v10
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          build-mount-path: /var/lib/docker

      - name: Restart Docker
        if: always() && steps.stop-docker.outputs.stopped == 'true'
        run: sudo systemctl start docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: v0.38.1
          driver-opts: |
            image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
            env.BUILDKIT_STEP_LOG_MAX_SIZE=50000000
          name: ${{ runner.environment == 'self-hosted' && format('frigate-rocm-{0}', github.repository_id) || '' }}
          keep-state: ${{ runner.environment == 'self-hosted' }}
          buildkitd-config: .github/buildkitd.toml

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Find reusable ROCm artifacts
        id: artifacts
        env:
          ARTIFACT_TAG: >-
            ${{ env.IMAGE }}:rocm-10.1-gfx900-artifacts-${{
              hashFiles('docker/rocm/Dockerfile.artifacts')
            }}
        run: |
          echo "tag=$ARTIFACT_TAG" >> "$GITHUB_OUTPUT"
          if digest=$(docker buildx imagetools inspect "$ARTIFACT_TAG" \
            --format '{{.Manifest.Digest}}' 2> "$RUNNER_TEMP/artifact-inspect.err"); then
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          elif grep -Eqi 'not found|manifest unknown|name unknown' "$RUNNER_TEMP/artifact-inspect.err"; then
            echo 'ROCm artifacts need to be built'
          else
            cat "$RUNNER_TEMP/artifact-inspect.err" >&2
            exit 1
          fi

      - name: Build and publish ROCm artifacts
        id: build-artifacts
        if: steps.artifacts.outputs.digest == ''
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7
        with:
          source: .
          push: true
          targets: rocm-artifacts
          files: docker/rocm/rocm.hcl
          set: |
            rocm-artifacts.tags=${{ steps.artifacts.outputs.tag }}
            rocm-artifacts.labels.org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            rocm-artifacts.labels.org.opencontainers.image.revision=${{ github.sha }}
            rocm-artifacts.cache-from=type=registry,ref=${{ env.IMAGE }}:cache-rocm-10.1-artifacts
            rocm-artifacts.cache-to=type=registry,ref=${{ env.IMAGE }}:cache-rocm-10.1-artifacts,mode=max

      - name: Build and push Frigate
        id: build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7
        env:
          ROCM_ARTIFACTS: >-
            docker-image://${{ env.IMAGE }}@${{
              steps.artifacts.outputs.digest ||
              fromJSON(steps.build-artifacts.outputs.metadata || '{}')['rocm-artifacts']['containerimage.digest']
            }}
        with:
          source: .
          push: true
          targets: rocm
          files: docker/rocm/rocm.hcl
          set: |
            rocm.tags=${{ env.IMAGE }}:${{ env.SHORT_SHA }}-rocm-10.1
            rocm.labels.org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            rocm.labels.org.opencontainers.image.revision=${{ github.sha }}
            *.cache-from=type=registry,ref=${{ env.IMAGE }}:cache-rocm-10.1
            rocm.cache-to=type=registry,ref=${{ env.IMAGE }}:cache-rocm-10.1,mode=max

      - name: Publish release tag and build summary
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        shell: python3 {0}
        run: |
          import json
          import os
          import subprocess
          import urllib.request

          digest = json.loads(os.environ["BUILD_METADATA"])["rocm"]["containerimage.digest"]
          image = os.environ["IMAGE"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"## Frigate ROCm 10.1\n\n- Image: `{image}@{digest}`\n")
          if os.environ["GITHUB_REF"] != "refs/heads/rocm-10.1":
              print("Published the commit image; this ref does not advance the release tag")
              raise SystemExit(0)
          url = (
              f'{os.environ["GITHUB_API_URL"]}/repos/{os.environ["GITHUB_REPOSITORY"]}'
              '/git/ref/heads/rocm-10.1'
          )
          request = urllib.request.Request(
              url, headers={"Authorization": f'Bearer {os.environ["GH_TOKEN"]}'}
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              head = json.load(response)["object"]["sha"]
          if head != os.environ["GITHUB_SHA"]:
              print("Published the commit image; a newer commit owns the release tag")
              raise SystemExit(0)
          tag = f"{image}:latest-rocm-10.1"
          subprocess.run([
              "docker", "buildx", "imagetools", "create", "--prefer-index=false",
              "--tag", tag, f"{image}@{digest}",
          ], check=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"- Release tag: `{tag}`\n")
